<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>THE TRAIL — clues bench</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #020610; color: #cfe0ee; overflow: hidden;
        font-family: "Space Mono", ui-monospace, Menlo, monospace;
      }
      canvas { display: block; }
      .hud { position: fixed; pointer-events: none; }
      .title { top: 18px; left: 20px; }
      .title h1 { margin: 0; font-size: 13px; letter-spacing: 0.28em; color: #6fd3e8; font-weight: 700; }
      .title p { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.12em; color: #6f8296; max-width: 560px; line-height: 1.6; }
      .note { top: 18px; right: 20px; text-align: right; font-size: 11px; letter-spacing: 0.1em; line-height: 1.7; color: #8fb8d8; max-width: 340px; }
      .note b { color: #ffc06e; font-weight: 700; }
      .bar {
        position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 20px 20px;
        display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        background: linear-gradient(transparent, rgba(3, 7, 14, 0.92) 42%);
      }
      button {
        background: rgba(18, 28, 40, 0.9); color: #9fc4de; cursor: pointer;
        border: 1px solid rgba(120, 170, 210, 0.28); border-radius: 3px;
        padding: 9px 14px; font: inherit; font-size: 11px; letter-spacing: 0.14em;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }
      button:hover { border-color: rgba(120, 200, 240, 0.7); color: #dff0ff; }
      button.on { background: rgba(40, 78, 104, 0.95); color: #fff; border-color: #6fd3e8; }
      button small { display: block; font-size: 9px; letter-spacing: 0.08em; color: #6f8296; margin-top: 3px; }
      button.on small { color: #9fd8ef; }
      .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: 0.2em; color: #6f8296; }
    </style>
  </head>
  <body>
    <div class="hud title">
      <h1>THE TRAIL — CLUES BENCH</h1>
      <p>Evidence made of real matter. Drag to orbit, scroll to zoom.
         Every clue points her line (the chevrons). Judge each on black
         before it enters the world.</p>
    </div>
    <div class="hud note" id="note"></div>
    <div class="bar" id="bar"></div>
    <div class="loading" id="loading">LOADING EVIDENCE…</div>
    <script type="module" src="/src/clues.ts"></script>
  </body>
</html>
