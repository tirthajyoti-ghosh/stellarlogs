<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Board texture candidates — pick one</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #04070c; color: #cfe0ee;
                   font-family: 'Rajdhani', system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; }
      #list { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 5;
              background: rgba(6,10,16,.94); border-right: 1px solid rgba(120,175,215,.16);
              overflow-y: auto; padding: 12px 0; }
      #list h2 { margin: 4px 14px 12px; font-size: 12px; letter-spacing: .28em; color: #6fd3e8; }
      .item { display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0;
              background: none; color: #b8cde0; font: inherit; font-size: 14px; cursor: pointer;
              border-left: 2px solid transparent; }
      .item:hover { background: rgba(120,175,215,.08); }
      .item.on { background: rgba(111,211,232,.13); border-left-color: #6fd3e8; color: #eaf6ff; }
      .item small { display: block; font-size: 10px; letter-spacing: .1em; color: rgba(150,190,225,.45); }
      #hint { position: fixed; right: 14px; top: 12px; z-index: 5; text-align: right;
              font-size: 11px; letter-spacing: .16em; color: rgba(150,190,225,.6); line-height: 1.9; }
      #hint b { color: #eaf6ff; background: rgba(120,175,215,.12); padding: 1px 6px; border-radius: 3px; }
      #now { position: fixed; left: 294px; top: 12px; z-index: 5; font-size: 13px; letter-spacing: .1em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <nav id="list"><h2>PLATE CANDIDATES</h2></nav>
    <div id="now"></div>
    <div id="hint">
      <b>drag</b> orbit — watch the sheen move<br />
      <b>wheel</b> zoom · <b>R</b> plate size<br />
      <b>[</b> <b>]</b> darker / brighter
    </div>

    <script type="importmap">
      { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      } }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      // ------------------------------------------------------------------
      // The SAME lighting as src/scene/boards/panelMaterial.ts (minus the
      // log-depth chunks this flat page does not need). What you judge here
      // is what ships.
      // ------------------------------------------------------------------
      const vert = `
        uniform vec3 uLamp0; uniform vec3 uLamp1; uniform vec3 uLamp2; uniform vec3 uLampAxis;
        varying vec2 vUv; varying vec3 vWorldPos; varying vec3 vN; varying vec3 vT; varying vec3 vB;
        varying vec3 vL0; varying vec3 vL1; varying vec3 vL2; varying vec3 vAxisW;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          vN = normalize(mat3(modelMatrix) * vec3(0.,0.,1.));
          vT = normalize(mat3(modelMatrix) * vec3(1.,0.,0.));
          vB = normalize(mat3(modelMatrix) * vec3(0.,1.,0.));
          vL0 = (modelMatrix * vec4(uLamp0,1.)).xyz;
          vL1 = (modelMatrix * vec4(uLamp1,1.)).xyz;
          vL2 = (modelMatrix * vec4(uLamp2,1.)).xyz;
          vAxisW = normalize(mat3(modelMatrix) * uLampAxis);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`
      const frag = `
        uniform sampler2D uMap; uniform sampler2D uNormalMap;
        uniform vec2 uRepeat; uniform vec3 uAmbient; uniform vec3 uLampColor;
        uniform float uFalloff; uniform float uSpec;
        varying vec2 vUv; varying vec3 vWorldPos; varying vec3 vN; varying vec3 vT; varying vec3 vB;
        varying vec3 vL0; varying vec3 vL1; varying vec3 vL2; varying vec3 vAxisW;
        vec3 lamp(vec3 lampPos, float intensity, vec3 N, vec3 V, vec3 albedo, float gloss) {
          vec3 Ld = lampPos - vWorldPos;
          float d2 = dot(Ld, Ld);
          vec3 L = Ld * inversesqrt(d2);
          float atten = 1.0 / (1.0 + uFalloff * d2);
          float spot = smoothstep(0.28, 0.72, dot(-L, vAxisW));
          float ndl = max(dot(N, L), 0.0);
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), 34.0) * uSpec * gloss;
          return uLampColor * (intensity * atten * spot) * (albedo * ndl + vec3(spec));
        }
        void main() {
          vec2 uv = vUv * uRepeat;
          vec3 albedo = texture2D(uMap, uv).rgb;
          vec3 nm = texture2D(uNormalMap, uv).xyz * 2.0 - 1.0;
          vec3 N = normalize(vT * nm.x + vB * nm.y + vN * nm.z);
          vec3 V = normalize(cameraPosition - vWorldPos);
          float gloss = 0.35 + 0.9 * albedo.b;
          vec3 col = uAmbient * albedo;
          col += lamp(vL0, 2.1, N, V, albedo, gloss);
          col += lamp(vL1, 2.5, N, V, albedo, gloss);
          col += lamp(vL2, 1.9, N, V, albedo, gloss);
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`

      // ---- compact port of the procedural plate (candidate 0) ------------
      function proceduralMaps() {
        const S = 512
        const rng = (seed) => () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff
        const r = rng(1129)
        const h = new Float32Array(S * S)
        const at = (x, y) => ((y + S) % S) * S + ((x + S) % S)
        const vS = [0, Math.round(168 + (r() - 0.5) * 22), Math.round(348 + (r() - 0.5) * 22)]
        const hS = [0, Math.round(250 + (r() - 0.5) * 30)]
        for (const sx of vS) for (let y = 0; y < S; y++) {
          const w = Math.round(Math.sin(y * 0.02 + sx) * 1.5)
          h[at(sx + w, y)] -= 1; h[at(sx + w + 1, y)] -= 1; h[at(sx + w - 1, y)] -= 0.35; h[at(sx + w + 2, y)] -= 0.35
        }
        for (const sy of hS) for (let x = 0; x < S; x++) {
          const w = Math.round(Math.sin(x * 0.02 + sy) * 1.5)
          h[at(x, sy + w)] -= 1; h[at(x, sy + w + 1)] -= 1; h[at(x, sy + w - 1)] -= 0.35; h[at(x, sy + w + 2)] -= 0.35
        }
        const rivets = []
        const rivet = (cx, cy) => { rivets.push([cx, cy])
          for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
            const d = Math.hypot(dx, dy); if (d < 3.6) h[at(cx + dx, cy + dy)] += 0.95 * (1 - (d / 3.6) ** 2) } }
        for (const sx of vS) for (let y = 14; y < S; y += 30 + Math.floor(r() * 8)) rivet(sx + 7, y)
        for (const sy of hS) for (let x = 20; x < S; x += 34 + Math.floor(r() * 8)) rivet(x, sy + 7)
        for (let y = 0; y < S; y++) { const amp = 0.02 + r() * 0.05; let v = 0
          for (let x = 0; x < S; x++) { v = v * 0.9 + (r() - 0.5) * 0.2; h[at(x, y)] += v * amp } }
        for (let i = 0; i < 16; i++) { const cx = r() * S | 0, cy = r() * S | 0, rad = 8 + r() * 18, dep = 0.2 + r() * 0.35
          for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
            const d = Math.hypot(dx, dy) / rad; if (d < 1) h[at(Math.round(cx + dx), Math.round(cy + dy))] -= dep * (1 - d * d) ** 2 } }
        const ac = document.createElement('canvas'); ac.width = ac.height = S
        const ctx = ac.getContext('2d')
        ctx.fillStyle = '#37434f'; ctx.fillRect(0, 0, S, S)
        const vs = [...vS, S], hs = [...hS, S]
        for (let i = 0; i < vs.length - 1; i++) for (let j = 0; j < hs.length - 1; j++) {
          const t = (r() - 0.5) * 26
          ctx.fillStyle = `rgba(${55 + t},${67 + t},${79 + t},0.5)`
          ctx.fillRect(vs[i], hs[j], vs[i + 1] - vs[i], hs[j + 1] - hs[j]) }
        for (let i = 0; i < 4; i++) { ctx.fillStyle = `rgba(${40 + r() * 30},${52 + r() * 30},${64 + r() * 30},0.3)`
          ctx.fillRect(r() * S, r() * S, 40 + r() * 90, 30 + r() * 70) }
        for (let i = 0; i < 700; i++) { const y = r() * S, x0 = r() * S
          ctx.strokeStyle = `rgba(${r() > 0.5 ? '190,205,220' : '10,16,24'},${0.02 + r() * 0.04})`
          ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + 30 + r() * 160, y + (r() - 0.5) * 2); ctx.stroke() }
        ctx.strokeStyle = 'rgba(8,12,18,0.5)'; ctx.lineWidth = 2
        for (const sx of vS) { ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, S); ctx.stroke() }
        for (const sy of hS) { ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(S, sy); ctx.stroke() }
        for (const [cx, cy] of rivets) { ctx.fillStyle = 'rgba(16,22,30,0.55)'
          ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, 6.29); ctx.fill() }
        for (const [cx, cy] of rivets) { if (r() > 0.34) continue
          const len = 16 + r() * 70, wdt = 1.5 + r() * 2.5
          const g = ctx.createLinearGradient(0, cy, 0, cy + len)
          g.addColorStop(0, `rgba(122,66,34,${0.25 + r() * 0.2})`); g.addColorStop(1, 'rgba(122,66,34,0)')
          ctx.fillStyle = g; ctx.fillRect(cx - wdt / 2 + (r() - 0.5) * 2, cy, wdt, len) }
        for (let i = 0; i < 26; i++) { const x = r() * S, y = r() * S
          const edge = Math.min(x, y, S - x, S - y) / (S / 2), rad = 12 + r() * 40
          const g = ctx.createRadialGradient(x, y, 0, x, y, rad)
          g.addColorStop(0, `rgba(${r() > 0.5 ? '110,62,36' : '20,26,34'},${(0.1 + r() * 0.14) * (1.25 - edge)})`)
          g.addColorStop(1, 'rgba(0,0,0,0)')
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.29); ctx.fill() }
        const nc = document.createElement('canvas'); nc.width = nc.height = S
        const nctx = nc.getContext('2d'); const img = nctx.createImageData(S, S)
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
          const dx = (h[at(x - 1, y)] - h[at(x + 1, y)]) * 1.7
          const dy = (h[at(x, y - 1)] - h[at(x, y + 1)]) * 1.7
          const inv = 1 / Math.hypot(dx, dy, 1); const o = (y * S + x) * 4
          img.data[o] = (dx * inv * 0.5 + 0.5) * 255; img.data[o + 1] = (dy * inv * 0.5 + 0.5) * 255
          img.data[o + 2] = (inv * 0.5 + 0.5) * 255; img.data[o + 3] = 255 }
        nctx.putImageData(img, 0, 0)
        const map = new THREE.CanvasTexture(ac); map.colorSpace = THREE.SRGBColorSpace
        const normalMap = new THREE.CanvasTexture(nc)
        return { map, normalMap }
      }

      // ---- scene ---------------------------------------------------------
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.setSize(innerWidth, innerHeight)
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.outputColorSpace = THREE.SRGBColorSpace
      document.getElementById('stage').appendChild(renderer.domElement)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x02040a)

      // stars
      {
        const n = 1500, pos = new Float32Array(n * 3)
        for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 4000
        const g = new THREE.BufferGeometry()
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3))
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd2ea, size: 1.6, sizeAttenuation: false })))
      }
      scene.add(new THREE.AmbientLight(0x8098b8, 0.35))
      const key = new THREE.DirectionalLight(0xcfe2ff, 0.7); key.position.set(4, 6, 8); scene.add(key)

      const W = 96, H = 64
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 6000)
      camera.position.set(0, -6, 120)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      const lampY = H / 2 + 2.6, lampZ = 3.5
      const lampAxis = new THREE.Vector3(0, -(H * 0.6 + 2.6), -3.1).normalize()
      const tilt = Math.atan2(H * 0.6 + 2.6, -3.1)
      const lampsLocal = [new THREE.Vector3(-W * 0.34, lampY, lampZ), new THREE.Vector3(0, lampY, lampZ), new THREE.Vector3(W * 0.34, lampY, lampZ)]

      const uniforms = {
        uMap: { value: null }, uNormalMap: { value: null },
        uRepeat: { value: new THREE.Vector2(W / 76, H / 76) },
        uLamp0: { value: lampsLocal[0] }, uLamp1: { value: lampsLocal[1] }, uLamp2: { value: lampsLocal[2] },
        uLampAxis: { value: lampAxis },
        uFalloff: { value: 5.5 / (H * H + 1) },
        uLampColor: { value: new THREE.Color(1.0, 0.93, 0.8) },
        uAmbient: { value: new THREE.Color(0.035, 0.045, 0.07) },
        uSpec: { value: 0.5 },
      }
      const panelMat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms })

      const board = new THREE.Group()
      scene.add(board)
      board.add(new THREE.Mesh(new THREE.PlaneGeometry(W, H), panelMat))
      const metal = new THREE.MeshStandardMaterial({ color: 0x2a323d, metalness: 0.6, roughness: 0.6, flatShading: true })
      const beam = 2.2
      for (const [w2, h2, x, y] of [[W + beam * 2, beam, 0, H / 2 + beam / 2], [W + beam * 2, beam, 0, -H / 2 - beam / 2], [beam, H, -W / 2 - beam / 2, 0], [beam, H, W / 2 + beam / 2, 0]]) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w2, h2, 2.4), metal)
        m.position.set(x, y, -0.5); board.add(m)
      }
      const back = new THREE.Mesh(new THREE.BoxGeometry(W + beam, H + beam, 0.8), metal)
      back.position.z = -1.4; board.add(back)
      // lamp rig
      const boom = new THREE.Mesh(new THREE.BoxGeometry(W * 0.78, 0.8, 0.8), metal)
      boom.position.set(0, lampY - 0.2, lampZ - 0.4); board.add(boom)
      const glowTex = (() => {
        const c = document.createElement('canvas'); c.width = c.height = 64
        const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 2, 32, 32, 31)
        g.addColorStop(0, 'rgba(255,250,238,1)'); g.addColorStop(0.35, 'rgba(255,238,205,0.5)'); g.addColorStop(1, 'rgba(255,230,190,0)')
        x.fillStyle = g; x.fillRect(0, 0, 64, 64)
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
      })()
      for (const p of lampsLocal) {
        const head = new THREE.Group(); head.position.copy(p); head.rotation.x = tilt
        const housing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 1.2), metal)
        housing.position.z = -0.7; head.add(housing)
        const face = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.3),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(2.6, 2.42, 1.98), toneMapped: false }))
        head.add(face); board.add(head)
        const glare = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.9),
          new THREE.MeshBasicMaterial({ map: glowTex, color: new THREE.Color(1.5, 1.4, 1.15), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }))
        glare.position.set(p.x, p.y - 0.3, p.z + 0.5); board.add(glare)
      }
      // sample text so legibility is part of the judgement
      const textTex = (() => {
        const c = document.createElement('canvas'); c.width = 1024; c.height = 683
        const x = c.getContext('2d')
        x.textAlign = 'center'
        x.fillStyle = '#f4f7fb'; x.font = '700 72px Rajdhani, sans-serif'
        x.fillText('Port Registry', 512, 120)
        x.fillStyle = '#e8a13c'; x.font = '500 44px Rajdhani, sans-serif'
        x.fillText('Every hull, rock and fixture here,', 512, 220)
        x.fillText('logged with its maker', 512, 275)
        x.fillStyle = '#9fd8ef'; x.font = '500 38px Rajdhani, sans-serif'
        x.fillText('The ship you fly · this station · the wreck on the lane', 512, 360)
        x.fillStyle = 'rgba(12,26,48,0.92)'; x.fillRect(180, 420, 664, 70)
        x.fillStyle = '#6fd3e8'; x.font = '600 40px Rajdhani, sans-serif'
        x.fillText('MCRN Tachi — Jakub.Vildomec', 512, 468)
        x.fillStyle = 'rgba(12,26,48,0.92)'; x.fillRect(180, 510, 664, 70)
        x.fillStyle = '#6fd3e8'; x.fillText('Gateway — andreas9343', 512, 558)
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
      })()
      const text = new THREE.Mesh(new THREE.PlaneGeometry(W - 8, (W - 8) * (683 / 1024)),
        new THREE.MeshBasicMaterial({ map: textTex, transparent: true, toneMapped: false }))
      text.position.z = 0.3
      board.add(text)

      // ---- candidates ----------------------------------------------------
      const loader = new THREE.TextureLoader()
      const proc = proceduralMaps()
      const manifest = await (await fetch('/_textures/manifest.json')).json()
      const list = document.getElementById('list')
      const now = document.getElementById('now')
      let repeatScale = 1

      async function show(entry, btn) {
        document.querySelectorAll('.item').forEach((b) => b.classList.remove('on'))
        btn?.classList.add('on')
        let map, normalMap
        if (entry.id === 'procedural') { map = proc.map; normalMap = proc.normalMap }
        else {
          ;[map, normalMap] = await Promise.all([loader.loadAsync(entry.color), loader.loadAsync(entry.normal)])
          map.colorSpace = THREE.SRGBColorSpace
        }
        for (const t of [map, normalMap]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8 }
        uniforms.uMap.value = map
        uniforms.uNormalMap.value = normalMap
        now.textContent = entry.name + ' · ' + entry.lic
      }
      manifest.forEach((entry, i) => {
        const b = document.createElement('button')
        b.className = 'item'
        b.innerHTML = entry.name + '<small>' + entry.lic + '</small>'
        b.onclick = () => show(entry, b)
        list.appendChild(b)
        if (i === 0) setTimeout(() => show(entry, b), 50)
      })

      addEventListener('keydown', (e) => {
        if (e.code === 'BracketLeft') renderer.toneMappingExposure = Math.max(0.3, renderer.toneMappingExposure - 0.12)
        if (e.code === 'BracketRight') renderer.toneMappingExposure = Math.min(2.5, renderer.toneMappingExposure + 0.12)
        if (e.code === 'KeyR') {
          repeatScale = repeatScale === 1 ? 1.5 : repeatScale === 1.5 ? 0.7 : 1
          uniforms.uRepeat.value.set((W / 76) * repeatScale, (H / 76) * repeatScale)
        }
      })

      renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera) })
    </script>
  </body>
</html>
