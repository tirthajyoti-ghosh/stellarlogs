<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>SHIPS &amp; DRIVES — bench</title>
<style>
  body { margin: 0; background: #06090f; font-family: "Space Mono", ui-monospace, monospace; }
  .grid {
    padding: 64px 8px 8px;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 44vh;
    gap: 8px;
  }
  .cell { position: relative; border: 1px solid rgba(111, 211, 232, 0.25); overflow: hidden; }
  .cell-label {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 6px 9px; font-size: 9px; letter-spacing: .22em; color: #9fd8ef;
    background: rgba(6, 10, 16, 0.7); pointer-events: none;
  }
  .cell-view { position: absolute; inset: 0; }
  .view-canvas { z-index: 2; }
  .panel {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; align-items: center;
  }
  .panel b { color: #9fd8ef; font-size: 11px; letter-spacing: .3em; margin-right: 10px; font-weight: 400; }
  .panel button {
    background: rgba(8,16,28,.8); color: #d5e8f2; border: 1px solid rgba(111,211,232,.4);
    font: 600 11px/1 "Rajdhani", sans-serif; letter-spacing: .2em; padding: 9px 16px; cursor: pointer;
  }
  .panel button.on { background: rgba(64,42,14,.9); border-color: rgba(255,192,110,.7); color: #ffd9a0; }
  .hint { display: none; }
</style>
</head>
<body>
  <div id="bench"></div>
  <div class="panel" id="panel">
    <b>SHIPS &amp; DRIVES</b>
    <button data-stage="0">OFF</button>
    <button data-stage="0.45">TRIM</button>
    <button data-stage="1.2" class="on">ACCEL</button>
    <button data-stage="1.85">BRAKE BLAZE</button>
    <button data-stage="2">MAX BURN</button>
  </div>
  <div class="hint">
    FRONT ROW — the working fleet: BLT-1129 (yours) · ICE HAULER · SALVAGE HAULER · STAR FREIGHTER · THE DRAUGR (true relative scale)<br/>
    BACK ROWS — design candidates, normalized size, no drives yet<br/>
    drag to orbit · scroll to zoom · right-drag to pan
  </div>
  <script type="module" src="/src/bench/ships.tsx"></script>
</body>
</html>
