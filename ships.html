<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>SHIPS &amp; DRIVES — bench</title>
<style>
  body { margin: 0; background: #06090f; overflow: hidden; font-family: "Space Mono", ui-monospace, monospace; }
  #bench { position: fixed; inset: 0; }
  .panel {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; align-items: center;
  }
  .panel b { color: #9fd8ef; font-size: 11px; letter-spacing: .3em; margin-right: 10px; font-weight: 400; }
  .panel button {
    background: rgba(8,16,28,.8); color: #d5e8f2; border: 1px solid rgba(111,211,232,.4);
    font: 600 11px/1 "Rajdhani", sans-serif; letter-spacing: .2em; padding: 9px 16px; cursor: pointer;
  }
  .panel button.on { background: rgba(64,42,14,.9); border-color: rgba(255,192,110,.7); color: #ffd9a0; }
  .hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #51697c; font-size: 10px; letter-spacing: .15em; z-index: 10; }
</style>
</head>
<body>
  <div id="bench"></div>
  <div class="panel" id="panel">
    <b>SHIPS &amp; DRIVES</b>
    <button data-stage="0">OFF</button>
    <button data-stage="0.45">TRIM</button>
    <button data-stage="1.2" class="on">ACCEL</button>
    <button data-stage="1.85">BRAKE BLAZE</button>
    <button data-stage="2">MAX BURN</button>
  </div>
  <div class="hint">
    BLT-1129 (yours) · ICE HAULER · SALVAGE HAULER · STAR FREIGHTER · THE DRAUGR — left to right, true relative scale<br/>
    drag to orbit · scroll to zoom · right-drag to pan
  </div>
  <script type="module" src="/src/bench/ships.tsx"></script>
</body>
</html>
